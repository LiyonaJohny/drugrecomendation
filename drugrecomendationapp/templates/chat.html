<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #007BFF;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .chat-box {
            width: 100%;
            max-width: 600px;
            height: 500px;
            overflow-y: auto;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 80%;
            padding: 10px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
        }

        .darker {
            background-color: #007BFF;
            color: white;
            align-self: flex-end;
        }

        .container p {
            margin: 0;
            padding: 5px 10px;
            word-wrap: break-word;
        }

        .container span {
            font-size: 12px;
            display: block;
            margin-top: 5px;
            opacity: 0.8;
        }

        .time-left {
            text-align: left;
            color: #888;
        }

        .time-right {
            text-align: right;
            color: #ccc;
        }

        .chat-input {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 60px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }

        .send-btn {
            background-color: darkorange;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            width: 100%;
        }

        .send-btn:hover {
            background-color: orangered;
        }
    </style>
</head>
<body>

    <a href="/userhome/">🏠 Home</a>

    <h2>CHAT MESSAGE</h2>

    <div class="chat-box">
        {% for i in alist %}
            <span class="time-left">{{ i.chatdate }}</span><br/>
            {% if i.typ == 'doctor' %}
                <div class="container" style="background: #e1f7d5;">
                    <p>{{ i.msg }}</p>
                    <span class="time-left">Doctor</span>
                </div>
            {% endif %}
            {% if i.typ == 'user' %}
                <div class="container darker">
                    <p>{{ i.msg }}</p>
                    <span class="time-right">You</span>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <form action="/chataction/" class="chat-input">
        <input type="hidden" name="lid" value="{{ lid }}">
        <input type="hidden" name="uid" value="{{ uid }}">
        <input type="hidden" name="cd" value="{{ cd }}">

        <textarea name="msg" placeholder="Type your message..." required></textarea>
        <button type="submit" class="send-btn">Send</button>
    </form>

</body>
</html>
