<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message</title>
    
    <style>
        body {
            margin: 0 auto;
            max-width: 800px;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        a {
            display: inline-block;
            margin: 10px 0;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .chat-container {
            height: 500px;
            overflow-y: auto;
            background-color: #222;
            padding: 15px;
            border-radius: 10px;
            color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
            width: 70%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
        }

        .darker {
            background-color: #d1e7ff;
            float: right;
            text-align: right;
        }

        .container::after {
            content: "";
            clear: both;
            display: table;
        }

        .container p {
            margin: 0;
            padding: 5px;
        }

        .time-right {
            float: right;
            color: #007bff;
            font-size: 12px;
        }

        .time-left {
            float: left;
            color: #ff9800;
            font-size: 12px;
        }

        .chat-input-container {
            position: sticky;
            bottom: 0;
            background-color: white;
            padding: 10px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 50px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        .send-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .send-btn:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>
    
    <a href="/doctorhome/">🏠 Home</a>  
    <h2 style="text-align: center;">Chat Message</h2>
    
    <div class="chat-container">
        {% for i in alist %}
        <span class="time-left">{{ i.chatdate }}</span><br/>
        {% if i.typ == 'user' %}
        <div class="container">
            <p align="left">{{ i.msg }}</p>
            <span class="time-left">Doctor</span>
        </div>
        {% endif %}
        {% if i.typ == 'doctor' %}
        <div class="container darker">
            <p align="right">{{ i.msg }}</p>
            <span class="time-right">You</span>
        </div>
        {% endif %}
        {% endfor %}
    </div>

    <!-- Chat Input Box -->
    <form action="/dchataction/" class="chat-input-container">
        <input type="hidden" name="uid" value="{{ uid }}">
        <textarea name="msg" placeholder="Type your message..."></textarea>
        <button type="submit" class="send-btn">Send</button>
    </form>

</body>
</html>
