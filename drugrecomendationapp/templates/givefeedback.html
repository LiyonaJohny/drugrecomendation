<!doctype html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="">
    <meta name="author" content="">

    <title>Drug Recommender</title>

    <!-- CSS FILES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">

    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">

    <link href="/static/css/tooplate-crispy-kitchen.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .dropdown {
            float: left;
            overflow: hidden;
        }

        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: rgba(14, 10, 10, 0.633);
            padding: 14px 16px;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }

        /* .navbar a:hover, .dropdown:hover .dropbtn {
          background-color: red;
        } */

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #0B2A4A6a;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(246, 244, 244, 0.958);
            z-index: 1;
        }

        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #1F6FEB33;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    {% include 'header.html' %}

    <main>

        <header class="site-header site-contact-header">
            <div class="container">
                <div class="row">

                    <div class="col-lg-10 col-12 mx-auto">
                        <h1 class="text-white">Review</h1>

                        <strong class="text-white"></strong>
                    </div>

                </div>
            </div>

            <div class="overlay"></div>
        </header>

        <section class="contact section-padding">
            <div class="container">
                <div class="row">



                    <div class="col-lg-12 col-9">
                        <center>
                                
                            <div class="col-lg-12 col-9">
    <center>
        <form method="post" style="width:60%; background-color:#f9f9f9; padding:20px; border:2px solid maroon; border-radius:8px;">
            {% csrf_token %}
            <h2 style="color:maroon; margin-bottom:15px;">Give Your Review</h2>
            
            <textarea name="feedback" rows="5" cols="60" 
                      placeholder="Enter your feedback here..."
                      style="width:90%; padding:10px; border:1px solid #ccc; border-radius:5px;" 
                      required></textarea>
            <br><br>
            
            <button type="submit" 
                    style="background-color:maroon; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">
                Submit
            </button>
        </form>
        <br>
        <a href="/viewfeedback/" 
           style="color:maroon; font-weight:bold; text-decoration:none;">
           View My Review
        </a>
    </center>
</div>

                            </div>
                            
                            
                        </center>
                    </div>



                </div>
            </div>
        </section>

    </main>

    {% include 'footer.html' %}

    <!-- Modal -->


    <!-- JAVASCRIPT FILES -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/custom.js"></script>

</body>

</html>
